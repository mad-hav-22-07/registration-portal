<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration</title>

<style>
  * { box-sizing: border-box; }
  body { max-width: 520px; margin: 32px auto; padding: 0 16px;
         font: 15px/1.5 system-ui, sans-serif; color: #17212b; }
  h2 { margin: 0 0 18px; font-size: 21px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 22px; }
  .tabs button { flex: 1; padding: 10px; font: inherit; font-weight: 600; cursor: pointer;
                 background: #fff; color: #4a5568; border: 1px solid #dfe3e8; border-radius: 8px; }
  .tabs button.on { background: #17212b; color: #fff; border-color: #17212b; }

  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 5px; }
  input, select { width: 100%; padding: 10px; font: inherit;
                  border: 1px solid #dfe3e8; border-radius: 8px; background: #fff; color: inherit; }
  input:focus, select:focus { outline: none; border-color: #2b6cb0; }
  #code { text-transform: uppercase; letter-spacing: 1px; font-family: ui-monospace, monospace; }

  .roles { display: flex; gap: 8px; }
  .roles label { flex: 1; margin: 0; padding: 10px; text-align: center; cursor: pointer;
                 border: 1px solid #dfe3e8; border-radius: 8px; font-weight: 500; }
  .roles input { display: none; }
  .roles label.on { background: #ebf4ff; border-color: #2b6cb0; color: #2b6cb0; font-weight: 600; }

  button.go { width: 100%; margin-top: 20px; padding: 12px; font: inherit; font-weight: 600;
              color: #fff; background: #2b6cb0; border: 0; border-radius: 8px; cursor: pointer; }
  button.go:disabled { background: #b8c2cc; }

  small { color: #7b8794; font-size: 12px; }
  .found { margin-top: 6px; font-size: 13px; color: #276749; }
  .missing { margin-top: 6px; font-size: 13px; color: #c53030; }

  .result { margin-top: 20px; padding: 18px; border-radius: 10px; background: #f0fff4; border: 1px solid #9ae6b4; text-align: center; }
  .result .big { font: 700 28px/1.2 ui-monospace, monospace; letter-spacing: 2px; color: #22543d; margin: 8px 0; }
  .err { margin-top: 18px; padding: 11px 13px; border-radius: 8px; background: #fff5f5; color: #c53030; font-size: 14px; }
</style>

<div class="tabs">
  <button id="tabP" class="on">Student / Teacher</button>
  <button id="tabS">School</button>
</div>

<!-- participant -->
<form id="formP">
  <h2>Register yourself</h2>

  <label for="code">School code</label>
  <input id="code" name="schoolCode" maxlength="6" placeholder="07KBO" autocomplete="off" required>
  <small>your school gets this when it registers — ask your teacher</small>
  <div id="schoolInfo"></div>

  <label>I am a</label>
  <div class="roles">
    <label id="lblStudent" class="on"><input type="radio" name="role" value="student" checked>Student</label>
    <label id="lblTeacher"><input type="radio" name="role" value="teacher">Teacher</label>
  </div>

  <label for="pname">Full name</label>
  <input id="pname" name="name" required>

  <label for="pemail">Email</label>
  <input id="pemail" name="email" type="email" required>

  <label for="pmobile">Mobile number</label>
  <input id="pmobile" name="mobile" inputmode="numeric" placeholder="9876543210" required>

  <button class="go" type="submit">Get my roll number</button>
</form>

<!-- school -->
<form id="formS" hidden>
  <h2>Register your school</h2>

  <label for="district">District</label>
  <select id="district" name="district" required><option value="">Select district</option></select>

  <label for="sname">School name</label>
  <input id="sname" name="name" required>
  <small>write the full name — this is what appears on every record</small>

  <label for="poc">Contact person</label>
  <input id="poc" name="pocName" required>

  <label for="pocm">Contact number</label>
  <input id="pocm" name="pocMobile" inputmode="numeric" placeholder="9876543210" required>

  <label for="semail">Email</label>
  <input id="semail" name="email" type="email" required>

  <button class="go" type="submit">Get school code</button>
</form>

<div id="out"></div>

<script>
const $ = (id) => document.getElementById(id);

fetch('/api/districts').then((r) => r.json()).then((list) => {
  for (const { code, name } of list) {
    $('district').insertAdjacentHTML('beforeend', `<option value="${code}">${code} — ${name}</option>`);
  }
});

const show = (which) => {
  $('formP').hidden = which !== 'P';
  $('formS').hidden = which !== 'S';
  $('tabP').className = which === 'P' ? 'on' : '';
  $('tabS').className = which === 'S' ? 'on' : '';
  $('out').innerHTML = '';
};
$('tabP').onclick = () => show('P');
$('tabS').onclick = () => show('S');

for (const r of ['Student', 'Teacher']) {
  $('lbl' + r).onclick = () => {
    $('lblStudent').className = r === 'Student' ? 'on' : '';
    $('lblTeacher').className = r === 'Teacher' ? 'on' : '';
  };
}

// confirm the school name as soon as a full code is typed, so nobody registers
// under the wrong school because of one mistyped letter
let lookup;
$('code').oninput = () => {
  const code = $('code').value.trim().toUpperCase();
  $('schoolInfo').innerHTML = '';
  clearTimeout(lookup);
  if (code.length < 5) return;
  lookup = setTimeout(async () => {
    const r = await fetch('/api/schools/' + encodeURIComponent(code));
    const d = await r.json();
    $('schoolInfo').innerHTML = r.ok
      ? `<div class="found">✓ ${d.name}, ${d.districtName}</div>`
      : `<div class="missing">no school with that code</div>`;
  }, 350);
};

async function submit(form, url, render) {
  const btn = form.querySelector('button.go');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'please wait…';
  $('out').innerHTML = '';

  try {
    const body = Object.fromEntries(new FormData(form));
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (d.error) {
      $('out').innerHTML = `<div class="err">${d.error}</div>`;
    } else {
      $('out').innerHTML = render(d);
      form.reset();
      $('schoolInfo').innerHTML = '';
    }
  } catch (e) {
    $('out').innerHTML = `<div class="err">${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

$('formP').onsubmit = (e) => {
  e.preventDefault();
  submit(e.target, '/api/participants', (d) => `
    <div class="result">
      <div>Your roll number</div>
      <div class="big">${d.roll}</div>
      <small>${d.name} · ${d.school}<br>write it down, you'll need it</small>
    </div>`);
};

$('formS').onsubmit = (e) => {
  e.preventDefault();
  submit(e.target, '/api/schools', (d) => `
    <div class="result">
      <div>${d.already ? 'This school is already registered. Its code is' : 'Your school code'}</div>
      <div class="big">${d.code}</div>
      <small>${d.name}<br>share this code with your students and teachers</small>
    </div>`);
};
</script>
