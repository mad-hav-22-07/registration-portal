<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Individual Registration</title>
<link rel="stylesheet" href="/shared.css">

<h1>Individual Registration</h1>
<p class="sub">Registering for your school instead? <a href="/school.html">School registration</a></p>

<form id="f">
  <label for="name">Full name</label>
  <input id="name" name="name" required>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>

  <label for="mobile">Contact number</label>
  <input id="mobile" name="mobile" inputmode="numeric" placeholder="9876543210" required>

  <label for="class">Class</label>
  <select id="class" name="class" required>
    <option value="">Select class</option>
  </select>

  <button class="go" type="submit">Register</button>
</form>

<div id="out"></div>

<script>
const $ = (id) => document.getElementById(id);

fetch('/api/options').then((r) => r.json()).then(({ classes }) => {
  for (const c of classes) $('class').insertAdjacentHTML('beforeend', `<option value="${c}">Class ${c}</option>`);
});

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('f').querySelector('button.go');
  btn.disabled = true;
  btn.textContent = 'registering…';
  $('out').innerHTML = '';

  try {
    const r = await fetch('/api/individuals', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(Object.fromEntries(new FormData($('f')))),
    });
    const d = await r.json();

    if (d.error) {
      $('out').innerHTML = `<div class="err">${d.error}</div>`;
    } else {
      $('out').innerHTML = `
        <div class="result">
          <div>Your roll number</div>
          <div class="big">${d.roll}</div>
          <small>${d.name} · Class ${d.class}<br>write it down, you will need it</small>
        </div>`;
      $('f').reset();
    }
  } catch (err) {
    $('out').innerHTML = `<div class="err">${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Register';
  }
};
</script>
