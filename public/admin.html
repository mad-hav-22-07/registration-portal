<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Registrations</title>

<style>
  body { max-width: 460px; margin: 60px auto; padding: 0 16px;
         font: 15px/1.5 system-ui, sans-serif; color: #17212b; }
  h2 { margin: 0 0 18px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 5px; }
  input { width: 100%; padding: 10px; font: inherit; border: 1px solid #dfe3e8; border-radius: 8px; }
  button { width: 100%; margin-top: 18px; padding: 12px; font: inherit; font-weight: 600;
           color: #fff; background: #2b6cb0; border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #b8c2cc; }
  .counts { display: flex; gap: 10px; margin-top: 20px; }
  .counts div { flex: 1; padding: 14px; text-align: center; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 10px; }
  .counts b { display: block; font-size: 24px; }
  .counts small { color: #7b8794; font-size: 12px; }
  .err { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #fff5f5; color: #c53030; font-size: 14px; }
</style>

<h2>Registrations</h2>

<form id="f">
  <label for="key">Admin key</label>
  <input id="key" type="password" placeholder="ADMIN_KEY from .env">
  <button id="load" type="submit">Show counts</button>
</form>
<p><a href="#" id="forget" style="color:#2b6cb0;font-size:13px">forget this key on this device</a></p>

<div id="counts"></div>
<div id="out"></div>

<script>
const $ = (id) => document.getElementById(id);

// remembered per browser only, so the key is not retyped on every visit
try { $('key').value = localStorage.getItem('adminKey') || ''; } catch {}

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

$('forget').onclick = (e) => {
  e.preventDefault();
  try { localStorage.removeItem('adminKey'); } catch {}
  $('key').value = '';
  $('counts').innerHTML = '';
  $('out').innerHTML = '<div style="padding:10px;border-radius:8px;background:#f7fafc;font-size:13px">Key cleared from this browser.</div>';
};

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const key = $('key').value.trim();
  if (!key) return;
  const btn = $('load');
  btn.disabled = true;
  $('out').innerHTML = '';

  try {
    const r = await fetch('/api/stats', { headers: { 'x-admin-key': key } });
    const text = await r.text();
    let d;
    try { d = JSON.parse(text); } catch {
      throw new Error(`The server returned an unexpected response (${r.status}).`);
    }

    if (d.error) {
      $('counts').innerHTML = '';
      $('out').innerHTML = `<div class="err">${esc(d.error)}</div>`;
      return;
    }
    // only remember the key once the server has actually accepted it, or a typo
    // gets autofilled forever and looks like a server fault
    try { localStorage.setItem('adminKey', key); } catch {}

  $('counts').innerHTML = `
    <div><b>${d.individuals}</b><small>individuals</small></div>
    <div><b>${d.schools}</b><small>schools</small></div>
    <div><b>${d.schoolStudents}</b><small>school students</small></div>`;
  $('out').innerHTML = `<button id="dl">Download Excel</button>`;

    // the key has to ride in the URL here: a browser download is a plain
    // navigation, so it cannot carry a custom header
    $('dl').onclick = () => { location.href = '/api/export.xlsx?key=' + encodeURIComponent(key); };
  } catch (err) {
    $('counts').innerHTML = '';
    $('out').innerHTML = `<div class="err">${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
};
</script>
